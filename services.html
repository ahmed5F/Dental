<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الخدمات - Ahmed Dental</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #eef6fb;
      padding: 30px;
      color: #333;
    }
    .service-box {
      background: white;
      padding: 20px;
      margin: 15px auto;
      max-width: 600px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #0077cc;
    }
  </style>
</head>
<body>

<h1>الخدمات التي نقدمها</h1>

<div class="service-box">
  <h2>تنظيف الأسنان</h2>
  <p>تنظيف احترافي يزيل الجير والبلاك لتحافظ على صحة لثتك.</p>
</div>

<div class="service-box">
  <h2>تبييض الأسنان</h2>
  <p>أحدث تقنيات التبييض للحصول على ابتسامة ناصعة.</p>
</div>

<div class="service-box">
  <h2>حشوات الأسنان</h2>
  <p>حشوات تجميلية متطورة لعلاج التسوس واستعادة المظهر الطبيعي.</p>
</div>

</body>
</html>
