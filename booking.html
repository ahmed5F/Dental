<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>حجز موعد – Ahmed Dental</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #eef6fb;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0077cc;
      color: white;
      padding: 20px;
      text-align: center;
    }
    form {
      background: white;
      max-width: 500px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      background-color: #0077cc;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>

  <header>
    <h1>حجز موعد</h1>
  </header>

  <form id="bookingForm">
    <label>الاسم الكامل</label>
    <input type="text" required />

    <label>رقم الهاتف</label>
    <input type="tel" required />

    <label>التاريخ</label>
    <input type="date" required />

    <label>الوقت</label>
    <select required>
      <option value="">اختر الوقت</option>
      <option>9:00 صباحًا</option>
      <option>10:00 صباحًا</option>
      <option>11:00 صباحًا</option>
      <option>1:00 ظهرًا</option>
      <option>3:00 عصرًا</option>
    </select>

    <button type="submit">تأكيد الحجز</button>
  </form>

</body>
</html>
